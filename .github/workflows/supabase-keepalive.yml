# Supabase 무료 플랜은 7일 동안 요청이 없으면 프로젝트가 일시 정지돼요.
# 매일 한 번 뉴스 1개를 읽는 가벼운 요청을 보내서 정지를 막아요.
# 필요한 저장소 Secrets (Settings > Secrets and variables > Actions > New repository secret):
#   SUPABASE_URL              예) https://xxxx.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  sb_publishable_... 로 시작하는 공개 키 (secret 키 아님)
name: Supabase keepalive

on:
  schedule:
    - cron: "27 0 * * *"   # 매일 한국시간 오전 9시 27분 (UTC 00:27)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one row from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY 저장소 Secrets 를 먼저 등록하세요."
            exit 1
          fi
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
              "${SUPABASE_URL%/}/rest/v1/news?select=id&limit=1" \
              -H "apikey: ${SUPABASE_KEY}")
            echo "시도 $i: HTTP $code"
            if [ "$code" = "200" ]; then echo "Supabase 깨우기 성공"; exit 0; fi
            sleep 20
          done
          cat /tmp/body.txt
          echo "::error::Supabase 응답이 200이 아니에요. 프로젝트가 이미 정지됐다면 대시보드에서 Restore 하세요."
          exit 1
